name: Build AILrc

on:
  push:
    paths:
      - 'plugin/**'
      - 'AILrc/**'
      - '.github/workflows/build-cpp.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'AILrc/**'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32, x64]
        include:
          - arch: Win32
            goarch: 386
          - arch: x64
            goarch: amd64

    steps:
    - uses: actions/checkout@v5

    # ── Build C++ Plugin ──
    - name: Configure CMake
      run: >
        cmake -S plugin -B plugin/build
        -G "Visual Studio 17 2022"
        -A ${{ matrix.arch }}

    - name: Build Plugin
      run: cmake --build plugin/build --config Release

    # ── Build AILrc (Go/Wails) ──
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: AILrc/go.sum

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: AILrc/frontend/package-lock.json

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Build AILrc App
      working-directory: AILrc
      env:
        GOARCH: ${{ matrix.goarch }}
      run: wails build -clean -platform windows/${{ matrix.goarch }}

    - name: Upload Plugin DLL
      uses: actions/upload-artifact@v7
      with:
        name: AILrc_plugin_${{ matrix.arch }}
        path: plugin/build/Release/AILrc_plugin.dll

    - name: Upload AILrc.exe
      uses: actions/upload-artifact@v7
      with:
        name: AILrc_${{ matrix.arch }}
        path: AILrc/build/bin/AILrc.exe

  package:
    needs: build
    runs-on: windows-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: Package .aimppack
      shell: pwsh
      run: |
        $packDir = "AILrc_plugin"
        New-Item -ItemType Directory -Path "$packDir/x64" -Force
        
        # Win32 binaries go to the root of the plugin folder
        Copy-Item "artifacts/AILrc_plugin_Win32/AILrc_plugin.dll" "$packDir/"
        Copy-Item "artifacts/AILrc_Win32/AILrc.exe" "$packDir/"
        
        # x64 binaries go to the x64 subfolder
        Copy-Item "artifacts/AILrc_plugin_x64/AILrc_plugin.dll" "$packDir/x64/"
        Copy-Item "artifacts/AILrc_x64/AILrc.exe" "$packDir/x64/"
        
        # Zip and rename to .aimppack
        Compress-Archive -Path "$packDir" -DestinationPath "AILrc.zip"
        Rename-Item "AILrc.zip" "AILrc.aimppack"

    - name: Upload .aimppack
      uses: actions/upload-artifact@v7
      with:
        name: AILrc.aimppack
        path: AILrc.aimppack
